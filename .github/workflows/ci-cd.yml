name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docker-php-updated]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Check generated contexts
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code
      - id: tags
        run: echo "tags=$(jq -c '[.builds[].name]' fwd-template.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ['8.1', '8.2', '8.3', '8.4']
        type: ['', '-prod']
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
    env:
      VARIANT: ${{ matrix.version }}-nginx-sqlsrv${{ matrix.type }}
    steps:
      - uses: actions/checkout@v7
      - uses: kool-dev/action/image-build@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          arch: ${{ matrix.platform.arch }}
      - name: Pull parent once and retain its ID for ancestry/runtime tests
        id: parent
        run: |
          parent=$(awk '$1 == "FROM" {print $2; exit}' "$VARIANT/Dockerfile")
          docker pull --platform linux/amd64 "$parent"
          echo "ref=$parent" >> "$GITHUB_OUTPUT"
          echo "id=$(docker image inspect "$parent" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Build from this job's fresh parent (never force-pull)
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.VARIANT }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          provenance: false
          tags: kooldev/php:${{ env.VARIANT }}
      - uses: kool-dev/action/image-parent@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          base-ref: ${{ steps.parent.outputs.ref }}
          base-id: ${{ steps.parent.outputs.id }}
          image-id: ${{ steps.image.outputs.imageid }}
      - name: Test exact image and parent IDs
        env:
          IMAGE: ${{ steps.image.outputs.imageid }}
          PARENT: ${{ steps.parent.outputs.id }}
        run: bash tests/test-image.sh "$IMAGE" "$VARIANT/Dockerfile" "$PARENT"
      - uses: kool-dev/action/image-stage@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-sqlsrv'
        with:
          canonical-repository: kool-dev/docker-php-sqlsrv
          default-branch: main
          repository: kooldev/php
          arch: ${{ matrix.platform.arch }}
          group: ${{ env.VARIANT }}
          images: '[{"tag":"${{ env.VARIANT }}","id":"${{ steps.image.outputs.imageid }}"}]'
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  publish:
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-sqlsrv'
    runs-on: ubuntu-24.04
    steps:
      - uses: kool-dev/action/image-publish@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          canonical-repository: kool-dev/docker-php-sqlsrv
          default-branch: main
          repository: kooldev/php
          tags: ${{ needs.checks.outputs.tags }}
          architectures: '["amd64"]'
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
