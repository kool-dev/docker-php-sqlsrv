name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docker-php-updated]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ['8.1', '8.2', '8.3', '8.4']
        type: ['', '-prod']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.2.0

      - name: Check generated Dockerfiles
        run: python3 tests/check-generated.py

      - name: Build
        run: |
          docker build --pull -t kooldev/php:${{ matrix.version }}-nginx-sqlsrv${{ matrix.type }} ${{ matrix.version }}-nginx-sqlsrv${{ matrix.type }}

      - name: Tests
        run: |
          bash tests/test-image.sh kooldev/php:${{ matrix.version }}-nginx-sqlsrv${{ matrix.type }} ${{ matrix.version }}-nginx-sqlsrv${{ matrix.type }}/Dockerfile

      - name: Login to DockerHub
        uses: docker/login-action@v2.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-sqlsrv'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-sqlsrv'
        run: |
          docker push kooldev/php:${{ matrix.version }}-nginx-sqlsrv${{ matrix.type }}
